name: Self-Hosted AppFlowy Cloud Docker Images
run-name: Build Self-Hosted ${{ github.event.inputs.custom_tag }} - Push ${{ github.event.inputs.push_appflowy_cloud == 'true' && '☁️' || '' }}${{ github.event.inputs.push_gotrue == 'true' && '🔐' || '' }}${{ github.event.inputs.push_appflowy_ai == 'true' && '🤖' || '' }}${{ github.event.inputs.push_appflowy_search == 'true' && '🔍' || '' }}${{ github.event.inputs.push_appflowy_backup == 'true' && '💾' || '' }} ${{ github.event.inputs.tag_latest == 'true' && 'latest' || '' }}

on:
  workflow_dispatch:
    inputs:
      appflowy_cloud_branch:
        description: "AppFlowy Cloud, Worker, Search & Backup branch (from AppFlowy-Cloud-Premium)"
        required: true
        default: "main"
      gotrue_branch:
        description: "GoTrue branch (from AppFlowy-Cloud-Premium)"
        required: true
        default: "main"
      appflowy_ai_branch:
        description: "AppFlowy AI branch (from AppFlowy-AI-Premium)"
        required: true
        default: "main"
      custom_tag:
        description: "Custom tag to use (overrides automatic tag generation). Example: 0.9.8"
        required: true
        default: ""
      push_gotrue:
        description: "Push GoTrue image to registry"
        type: boolean
        required: false
        default: false
      push_appflowy_cloud:
        description: "Push AppFlowy Cloud and Worker images to registry"
        type: boolean
        required: false
        default: true
      push_appflowy_ai:
        description: "Push AppFlowy AI image to registry"
        type: boolean
        required: false
        default: false
      push_appflowy_search:
        description: "Push AppFlowy Search image to registry"
        type: boolean
        required: false
        default: true
      push_appflowy_backup:
        description: "Build and publish the optional AppFlowy Backup image"
        type: boolean
        required: false
        default: false
      build_arm64:
        description: "Also build ARM64 images (AMD64 always built)"
        type: boolean
        required: false
        default: true 
      tag_latest:
        description: "Also tag and publish 'latest'"
        type: boolean
        required: false
        default: true
      
env:
  LATEST_TAG: latest
  LOCALHOST_URL: http://localhost
  LOCALHOST_WS: ws://localhost/ws/v1
  LOCALHOST_WS_V2: ws://localhost/ws/v2
  APPFLOWY_REDIS_URI: redis://redis:6379
  APPFLOWY_AI_REDIS_URL: redis://redis:6379
  LOCALHOST_GOTRUE: http://localhost/gotrue
  POSTGRES_PASSWORD: password
  DATABASE_URL: postgres://postgres:password@localhost:5432/postgres
  SQLX_OFFLINE: true
  RUST_TOOLCHAIN: "1.86.0"
  CI_APPFLOWY_CLOUD_FEATURES: "self-host-af"  # Define your features here

jobs:
  # Backup has its own opt-in chain: skipped application test jobs must not block
  # its manifest, and both native architectures must use the same source commit.
  appflowy_backup_prepare:
    if: ${{ inputs.push_appflowy_backup }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Check out the selected Backup source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AppFlowy-IO/AppFlowy-Cloud-Premium
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          ref: ${{ inputs.appflowy_cloud_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve Backup source and validate version
        id: source
        env:
          CUSTOM_TAG: ${{ inputs.custom_tag }}
        run: |
          if [[ ! "$CUSTOM_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ || ${#CUSTOM_TAG} -gt 120 ]]; then
            echo '::error::Backup version must be a valid Docker tag with room for architecture suffixes'
            exit 1
          fi
          printf 'sha=%s\nversion=%s\n' "$(git rev-parse --verify HEAD)" "$CUSTOM_TAG" >> "$GITHUB_OUTPUT"

  appflowy_backup_image:
    if: ${{ inputs.push_appflowy_backup }}
    needs: appflowy_backup_prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      IMAGE_NAME: appflowyinc/appflowy_backup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.build_arm64 && '[{"arch":"amd64","runner":"ubuntu-22.04"},{"arch":"arm64v8","runner":"ubuntu-24.04-arm"}]' || '[{"arch":"amd64","runner":"ubuntu-22.04"}]') }}
    steps:
      - name: Check out the resolved Backup source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AppFlowy-IO/AppFlowy-Cloud-Premium
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          ref: ${{ needs.appflowy_backup_prepare.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify native build architecture
        id: platform
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH:$(uname -m)" in
            amd64:x86_64) platform=linux/amd64 ;;
            arm64v8:aarch64) platform=linux/arm64 ;;
            *) echo '::error::Backup platform does not match its native runner'; exit 1 ;;
          esac
          printf 'value=%s\n' "$platform" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Keep private-source builder layers and build records out of this public repository.
      - name: Build and publish the combined Backup image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: services/appflowy-backup/Dockerfile
          target: backup
          platforms: ${{ steps.platform.outputs.value }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.appflowy_backup_prepare.outputs.version }}-${{ matrix.arch }}
          build-args: |
            POSTGRES_MAJOR=16
            BACKUP_BUILD_JOBS=2
          labels: |
            org.opencontainers.image.source=https://github.com/AppFlowy-IO/AppFlowy-Cloud-Premium
            org.opencontainers.image.revision=${{ needs.appflowy_backup_prepare.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.appflowy_backup_prepare.outputs.version }}
          provenance: false
          pull: true

      - name: Check Backup runtime tools on the native runner
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo '::error::Invalid Backup image digest'; exit 1; }
          docker run --rm --network none --entrypoint sh "$IMAGE_NAME@$DIGEST" -e -c '
            test "$(id -u)" != 0
            test -x /usr/local/bin/docker-entrypoint.sh
            postgres --version | grep -E "PostgreSQL[)] 16[.]"
            pg_dump --version | grep -E "PostgreSQL[)] 16[.]"
            pgbackrest version
            docker --version
            docker compose version
            appflowy_backup --help
          '
          test "$(docker image inspect "$IMAGE_NAME@$DIGEST" --format '{{json .Config.Entrypoint}}')" = '["appflowy_backup","service"]'
          mkdir -p "$RUNNER_TEMP/backup-digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/backup-digests/${{ matrix.arch }}"

      - name: Upload the verified Backup digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backup-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/backup-digests/${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Logout from Docker Hub
        if: always()
        run: docker logout

  appflowy_backup_manifest:
    if: ${{ inputs.push_appflowy_backup }}
    needs: [appflowy_backup_prepare, appflowy_backup_image]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      IMAGE_NAME: appflowyinc/appflowy_backup
      IMAGE_TAG: ${{ needs.appflowy_backup_prepare.outputs.version }}
    steps:
      - name: Download verified Backup digests from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: backup-digest-*
          path: ${{ runner.temp }}/backup-digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Publish the Backup version and optional latest manifest
        env:
          BUILD_ARM64: ${{ inputs.build_arm64 }}
          TAG_LATEST: ${{ inputs.tag_latest }}
        run: |
          architectures=(amd64)
          if [[ "$BUILD_ARM64" == true ]]; then architectures+=(arm64v8); fi
          sources=()
          for arch in "${architectures[@]}"; do
            digest="$(cat "$RUNNER_TEMP/backup-digests/$arch")"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo '::error::Invalid Backup image digest'; exit 1; }
            sources+=("$IMAGE_NAME@$digest")
          done
          tags=(--tag "$IMAGE_NAME:$IMAGE_TAG")
          if [[ "$TAG_LATEST" == true ]]; then tags+=(--tag "$IMAGE_NAME:latest"); fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          if [[ "$TAG_LATEST" == true ]]; then
            for arch in "${architectures[@]}"; do
              digest="$(cat "$RUNNER_TEMP/backup-digests/$arch")"
              docker buildx imagetools create --tag "$IMAGE_NAME:latest-$arch" "$IMAGE_NAME@$digest"
            done
          fi
          {
            printf '### Published %s:%s\n\n' "$IMAGE_NAME" "$IMAGE_TAG"
            printf -- '- Source commit: %s\n' '${{ needs.appflowy_backup_prepare.outputs.source_sha }}'
            printf -- '- PostgreSQL tools: 16; production target: backup\n'
            for arch in "${architectures[@]}"; do
              printf -- '- %s:%s-%s\n' "$IMAGE_NAME" "$IMAGE_TAG" "$arch"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logout from Docker Hub
        if: always()
        run: docker logout

  gotrue_image:
    if: ${{ github.event.inputs.push_gotrue == 'true' }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: true
      matrix:
        job: ${{ fromJson(github.event.inputs.build_arm64 == 'true' && '[{"os":"ubuntu-22.04","name":"amd64","docker_platform":"linux/amd64"},{"os":"ubuntu-22.04-arm","name":"arm64v8","docker_platform":"linux/arm64"}]' || '[{"os":"ubuntu-22.04","name":"amd64","docker_platform":"linux/amd64"}]') }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          repository: AppFlowy-IO/AppFlowy-Cloud-Premium
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.gotrue_branch }}
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get git tag
        id: vars
        run: |
          T="${{ github.event.inputs.custom_tag }}"
          echo "GIT_TAG=$T" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build GoTrue ${{ matrix.job.name }}
        uses: docker/build-push-action@v5
        with:
          context: ./docker/gotrue
          file: ./docker/gotrue/Dockerfile
          platforms: ${{ matrix.job.docker_platform }}
          push: false
          load: true
          cache-from: type=gha,scope=gotrue-${{ matrix.job.name }}
          cache-to: type=gha,mode=max,scope=gotrue-${{ matrix.job.name }}
          tags: |
            appflowyinc/gotrue:${{ env.GIT_TAG }}-${{ matrix.job.name }}
            appflowyinc/gotrue:${{ env.LATEST_TAG }}-${{ matrix.job.name }}

      - name: Save GoTrue image locally
        run: |
          mkdir -p /tmp/docker-images
          docker save appflowyinc/gotrue:${{ env.GIT_TAG }}-${{ matrix.job.name }} | gzip > /tmp/docker-images/gotrue_${{ matrix.job.name }}.tar.gz
          docker save appflowyinc/gotrue:${{ env.LATEST_TAG }}-${{ matrix.job.name }} | gzip > /tmp/docker-images/gotrue_latest_${{ matrix.job.name }}.tar.gz

      - name: Upload GoTrue image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gotrue-image-${{ matrix.job.name }}
          path: /tmp/docker-images/gotrue_*.tar.gz
          retention-days: 1

      - name: Logout from Docker Hub
        if: always()
        run: docker logout
  gotrue_push:
    runs-on: ubuntu-22.04
    if: ${{ github.event.inputs.push_gotrue == 'true' }}
    needs: [gotrue_image]
    strategy:
      fail-fast: true
      matrix:
        job: ${{ fromJson(github.event.inputs.build_arm64 == 'true' && '[{"name":"amd64"},{"name":"arm64v8"}]' || '[{"name":"amd64"}]') }}
    steps:
      - name: Get git tag
        id: vars
        run: |
          T="${{ github.event.inputs.custom_tag }}"
          echo "GIT_TAG=$T" >> $GITHUB_ENV

      - name: Download GoTrue image
        uses: actions/download-artifact@v4
        with:
          name: gotrue-image-${{ matrix.job.name }}
          path: /tmp/docker-images

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Load and Push GoTrue
        run: |
          docker load < /tmp/docker-images/gotrue_${{ matrix.job.name }}.tar.gz
          docker load < /tmp/docker-images/gotrue_latest_${{ matrix.job.name }}.tar.gz || true
          if [[ "${{ github.event.inputs.tag_latest }}" == "true" ]]; then
            docker push appflowyinc/gotrue:${{ env.LATEST_TAG }}-${{ matrix.job.name }}
          fi
          docker push appflowyinc/gotrue:${{ env.GIT_TAG }}-${{ matrix.job.name }}

      - name: Logout from Docker Hub
        if: always()
        run: docker logout

  gotrue_manifest:
    runs-on: ubuntu-22.04
    if: ${{ github.event.inputs.push_gotrue == 'true' }}
    needs: [gotrue_push]
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Get git tag
        id: vars
        run: |
          T="${{ github.event.inputs.custom_tag }}"
          echo "GIT_TAG=$T" >> $GITHUB_ENV

      - name: Create and push manifest for gotrue:version
        uses: Noelware/docker-manifest-action@0.4.3
        with:
          inputs: appflowyinc/gotrue:${{ env.GIT_TAG }}
          images: appflowyinc/gotrue:${{ env.GIT_TAG }}-amd64${{ github.event.inputs.build_arm64 == 'true' && format(',appflowyinc/gotrue:{0}-arm64v8', env.GIT_TAG) || '' }}
          push: true

      - name: Create and push manifest for gotrue:latest
        if: ${{ github.event.inputs.tag_latest == 'true' }}
        uses: Noelware/docker-manifest-action@0.4.3
        with:
          inputs: appflowyinc/gotrue:${{ env.LATEST_TAG }}
          images: appflowyinc/gotrue:${{ env.LATEST_TAG }}-amd64${{ github.event.inputs.build_arm64 == 'true' && format(',appflowyinc/gotrue:{0}-arm64v8', env.LATEST_TAG) || '' }}
          push: true

      - name: Logout from Docker Hub
        if: always()
        run: docker logout

  appflowy_cloud_image:
    runs-on: ${{ matrix.job.os }}
    env:
      IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/appflowy_cloud
    strategy:
      fail-fast: true
      matrix:
        job: ${{ fromJson(github.event.inputs.build_arm64 == 'true' && '[{"os":"ubuntu-22.04","name":"amd64","docker_platform":"linux/amd64"},{"os":"ubuntu-22.04-arm","name":"arm64v8","docker_platform":"linux/arm64"}]' || '[{"os":"ubuntu-22.04","name":"amd64","docker_platform":"linux/amd64"}]') }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          repository: AppFlowy-IO/AppFlowy-Cloud-Premium
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.appflowy_cloud_branch }}
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get git tag
        id: vars
        run: |
          T="${{ github.event.inputs.custom_tag }}"
          echo "GIT_TAG=$T" >> $GITHUB_ENV

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: registry.hub.docker.com/${{ env.IMAGE_NAME }}

      - name: Build ${{ matrix.job.name }}:${{ env.GIT_TAG }} 
        run: |
          echo "::group::build-appflowy-cloud-${{ matrix.job.name }}"
          docker buildx build \
            --platform ${{ matrix.job.docker_platform }} \
            -f ./Dockerfile \
            -t ${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }}-${{ matrix.job.name }} \
            -t ${{ env.IMAGE_NAME }}:${{ env.GIT_TAG }}-${{ matrix.job.name }} \
            --cache-from type=gha,scope=appflowy_cloud-${{ matrix.job.name }} \
            --cache-to type=gha,mode=max,scope=appflowy_cloud-${{ matrix.job.name }} \
            --build-arg PROFILE=release \
            --build-arg FEATURES=${{ env.CI_APPFLOWY_CLOUD_FEATURES }} \
            --build-arg APP_VERSION=${{ env.GIT_TAG }} \
            --load \
            --quiet \
            .
          echo "::endgroup::"

      - name: Save AppFlowy Cloud image locally
        run: |
          mkdir -p /tmp/docker-images
          docker save ${{ env.IMAGE_NAME }}:${{ env.GIT_TAG }}-${{ matrix.job.name }} | gzip > /tmp/docker-images/appflowy_cloud_${{ matrix.job.name }}.tar.gz
          docker save ${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }}-${{ matrix.job.name }} | gzip > /tmp/docker-images/appflowy_cloud_latest_${{ matrix.job.name }}.tar.gz

      - name: Upload AppFlowy Cloud image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: appflowy-cloud-image-${{ matrix.job.name }}
          path: /tmp/docker-images/appflowy_cloud_*.tar.gz
          retention-days: 1

  wait_for_all_builds:
    runs-on: ubuntu-22.04
    needs: [gotrue_image, appflowy_cloud_image, appflowy_worker_image, appflowy_ai_image]
    if: always()
    steps:
      - name: Check build results
        run: |
          echo "All selected image builds have completed"
          echo "GoTrue build: ${{ needs.gotrue_image.result }}"
          echo "AppFlowy Cloud build: ${{ needs.appflowy_cloud_image.result }}"
          echo "AppFlowy Worker build: ${{ needs.appflowy_worker_image.result }}"
          echo "AppFlowy AI build: ${{ needs.appflowy_ai_image.result }}"

          # GoTrue is optional; the remaining application images are required.
          if [[ "${{ github.event.inputs.push_gotrue }}" == "true" && "${{ needs.gotrue_image.result }}" != "success" ]] || \
             [[ "${{ needs.appflowy_cloud_image.result }}" != "success" ]] || \
             [[ "${{ needs.appflowy_worker_image.result }}" != "success" ]] || \
             [[ "${{ needs.appflowy_ai_image.result }}" != "success" ]]; then
            echo "❌ One or more required builds did not succeed"
            exit 1
          else
            echo "✅ All required builds completed successfully"
          fi

  # Jobs downstream of optional GoTrue must override the implicit success() check
  # and require their direct prerequisite to succeed, even when GoTrue is skipped.
  appflowy_cloud_test:
    runs-on: ubuntu-22.04
    if: ${{ !cancelled() && needs.wait_for_all_builds.result == 'success' && github.event.inputs.push_appflowy_cloud == 'true' }}
    needs: [wait_for_all_builds]
    env:
      IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/appflowy_cloud
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          repository: AppFlowy-IO/AppFlowy-Cloud-Premium
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.appflowy_cloud_branch }}
          fetch-depth: 1

      - name: Get git tag
        id: vars
        run: |
          T="${{ github.event.inputs.custom_tag }}"
          echo "GIT_TAG=$T" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Download GoTrue image (amd64)
        if: ${{ github.event.inputs.push_gotrue == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: gotrue-image-amd64
          path: /tmp/docker-images

      - name: Load GoTrue image locally
        if: ${{ github.event.inputs.push_gotrue == 'true' }}
        run: |
          docker load < /tmp/docker-images/gotrue_amd64.tar.gz
          docker load < /tmp/docker-images/gotrue_latest_amd64.tar.gz

      - name: Pull GoTrue fallback image
        if: ${{ github.event.inputs.push_gotrue != 'true' }}
        run: docker pull appflowyinc/gotrue:${{ env.LATEST_TAG }}

      - name: Download AppFlowy Cloud image (amd64)
        uses: actions/download-artifact@v4
        with:
          name: appflowy-cloud-image-amd64
          path: /tmp/docker-images

      - name: Download AppFlowy Worker image (amd64)
        uses: actions/download-artifact@v4
        with:
          name: appflowy-worker-image-amd64
          path: /tmp/docker-images

      - name: Download AppFlowy AI image (amd64)
        uses: actions/download-artifact@v4
        with:
          name: appflowy-ai-image-amd64
          path: /tmp/docker-images

      - name: Load all locally built images
        run: |
          # Load all locally built application images.
          docker load < /tmp/docker-images/appflowy_cloud_amd64.tar.gz
          docker load < /tmp/docker-images/appflowy_cloud_latest_amd64.tar.gz
          docker load < /tmp/docker-images/appflowy_worker_amd64.tar.gz
          docker load < /tmp/docker-images/appflowy_worker_latest_amd64.tar.gz
          docker load < /tmp/docker-images/appflowy_ai_amd64.tar.gz
          docker load < /tmp/docker-images/appflowy_ai_latest_amd64.tar.gz

      - name: Retag GoTrue image
        if: ${{ github.event.inputs.push_gotrue == 'true' }}
        run: |
          docker tag appflowyinc/gotrue:${{ env.GIT_TAG }}-amd64 appflowyinc/gotrue:${{ env.GIT_TAG }}
          docker tag appflowyinc/gotrue:${{ env.LATEST_TAG }}-amd64 appflowyinc/gotrue:${{ env.LATEST_TAG }}

      - name: Run Docker Compose for testing
        run: |
          # Set environment variables for docker-compose to use locally built images
          export APPFLOWY_CLOUD_VERSION=${{ env.GIT_TAG }}-amd64
          export APPFLOWY_WORKER_VERSION=${{ env.GIT_TAG }}-amd64
          export APPFLOWY_AI_VERSION=${{ env.GIT_TAG }}-amd64
          export APPFLOWY_ADMIN_FRONTEND_VERSION=latest-amd64
          export GOTRUE_VERSION=${{ env.LATEST_TAG }}
          
          # Retag all locally built images to match docker-compose-ci.yml image names
          # Tag AppFlowy Cloud
