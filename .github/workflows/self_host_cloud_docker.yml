  cleanup_artifacts:
    runs-on: ubuntu-22.04
    if: always()
    needs: [gotrue_manifest, appflowy_cloud_manifest, appflowy_ai_manifest, appflowy_worker_manifest, appflowy_search_manifest]
    steps:
      - name: Delete GoTrue artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            gotrue-image-amd64
            gotrue-image-arm64v8
